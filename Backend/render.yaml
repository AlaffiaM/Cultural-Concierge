services:
  - type: web
    name: culture-concierge
    rootDir: Backend
    env: node
    buildCommand: cd ../Frontend && npm install && npm run build && cd ../Backend && npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: BOT_SCHEDULE
        value: 0 0,18 * * *
      - key: VENUE_BOT_SCHEDULE
        value: 0 0,18 * * *
      - key: BOT_TIMEZONE
        value: Africa/Nairobi
      - key: BOT_EMAIL_ON
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: BREVO_LIST_ID
        sync: false
