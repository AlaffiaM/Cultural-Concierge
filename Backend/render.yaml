services:
  - type: web
    name: culture-concierge
    rootDir: Backend
    env: node
    buildCommand: cd ../Frontend && npm install && npm run build && cd ../Backend && npm install && npx puppeteer browsers install chrome
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
